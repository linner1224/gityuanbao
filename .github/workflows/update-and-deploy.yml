name: Update news and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    # 08:17 in Asia/Shanghai. A non-zero minute reduces peak-time delays.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Python version
        run: python3 --version

      - name: Run parser tests
        run: python3 -m unittest discover -s tests -v

      - name: Fetch current RSS data
        run: python3 scripts/fetch_news.py

      - name: Save update results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/update-status.json
          if git diff --cached --quiet; then
            echo "No data or status changes to commit."
          else
            git commit -m "data: update AI news feeds"
            git push
          fi

      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/news.json data/update-status.json _site/data/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
